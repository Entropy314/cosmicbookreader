[package]
name = "cosmicbookreader"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "cosmicbookreader_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }

# Archive / comic formats
zip = { version = "2", default-features = false, features = ["deflate"] }
sevenz-rust = { version = "0.6", default-features = false }

# Image processing
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }

# PDF rendering
pdfium-render = { version = "0.8", features = ["sync"] }

# Async runtime
tokio = { version = "1", features = ["rt", "sync", "net", "time", "io-util", "fs", "macros"] }

# Thumbnail cache
rusqlite = { version = "0.31", features = ["bundled"] }

# Utilities
blake3 = "1"
walkdir = "2"
base64 = { version = "0.22", features = ["std"] }
anyhow = "1"
natord = "1"
regex = "1"
unrar-ng = "0.7.7"

# Google Drive: native OAuth, streaming downloads, and OS credential storage.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde_json = "1"
sha2 = "0.10"
rand = "0.8"
open = "5"
tempfile = "3"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
