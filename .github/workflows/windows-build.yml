name: Windows build

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "src/**"
      - "src-tauri/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "Trunk.toml"
      - "index.html"
      - "styles.css"
      - ".github/workflows/windows-build.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/bin
            src-tauri/target
          key: windows-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install trunk and tauri-cli
        shell: bash
        # ponytail: crates.io fetches occasionally flake on the Windows
        # runner; a couple of retries clears it without hand-rolled polling.
        run: |
          for i in 1 2 3; do
            cargo install trunk tauri-cli --locked && exit 0
            echo "install failed (attempt $i/3), retrying in 10s..."
            sleep 10
          done
          exit 1

      - name: Build
        run: cargo tauri build

      - uses: actions/upload-artifact@v4
        with:
          name: cosmicbookreader-windows
          path: |
            src-tauri/target/release/cosmicbookreader.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
