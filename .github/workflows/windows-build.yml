name: Windows build

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "src/**"
      - "src-tauri/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "Trunk.toml"
      - "index.html"
      - "styles.css"
      - ".github/workflows/windows-build.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/bin
            target
          key: windows-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install trunk and tauri-cli
        shell: bash
        # The cache above restores ~/.cargo/bin on a hit, and `cargo install`
        # refuses to overwrite an existing binary without --force - so skip
        # the (re)install entirely once both are already on PATH.
        run: |
          command -v trunk >/dev/null && command -v cargo-tauri >/dev/null \
            || cargo install trunk tauri-cli --locked

      - name: Configure Google Drive OAuth client
        if: ${{ secrets.GOOGLE_DRIVE_CLIENT_JSON != '' }}
        shell: bash
        env:
          DRIVE_CLIENT_JSON: ${{ secrets.GOOGLE_DRIVE_CLIENT_JSON }}
        run: |
          printf '%s' "$DRIVE_CLIENT_JSON" > "$RUNNER_TEMP/google-drive-client.json"
          echo "COSMIC_GOOGLE_OAUTH_CLIENT_JSON=$RUNNER_TEMP/google-drive-client.json" >> "$GITHUB_ENV"

      - name: Build
        run: cargo tauri build

      - uses: actions/upload-artifact@v4
        with:
          name: cosmicbookreader-windows
          path: |
            target/release/cosmicbookreader.exe
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*.exe
